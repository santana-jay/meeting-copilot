[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-copilot"
version = "0.1.0"
description = "Cross-platform, local-first background meeting co-pilot with grounded AI suggestions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "santana-jay" }]
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# Heavy / platform-specific runtime extras. The core library and its tests do
# not require these; they are imported lazily by the relevant backends.
ui = ["PySide6>=6.6"]
ai = ["anthropic>=0.39"]
stt = ["faster-whisper>=1.0"]
keyring = ["keyring>=24.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
meeting-copilot = "meeting_copilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_copilot = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
